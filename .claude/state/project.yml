# Project identity and stack (discovered 2026-09-25)
# Format: JSON-compatible YAML (YAML 1.2 superset of JSON) — see .claude/decisions/ADR-0002-machine-readable-yaml.md
{
  "name": "lander-records-site",
  "product": "Lander Records public site + CMS (/admin)",
  "singleTarget": true,
  "stack": {
    "framework": "Next.js 16.3.3 App Router (output: standalone, trailingSlash: true, reactStrictMode)",
    "language": "TypeScript 5 (strict tsc --noEmit), React 19",
    "packageManager": "npm (package-lock.json); engines node >=24 <25 (.nvmrc)",
    "database": "PostgreSQL via postgres.js + Drizzle ORM 0.45.2 (lib/db/*.ts)",
    "migrations": "hand-written SQL in migrations/NNNN_*.sql applied by scripts/migrate.mjs with cms_schema_migrations checksums; remote targets refused unless MIGRATION_RELEASE_GUARD=VERIFIED_PITR_BACKUP_REHEARSAL",
    "validation": "zod 3 (route payloads, server actions)",
    "auth": "server-side admin sessions (cookie lander_admin_session, bcryptjs, lockout after 5 failures for 15 min), RBAC viewer<editor<admin<owner (lib/auth/policy.ts), proxy.ts boundary for /admin and /api/admin",
    "storage": "Supabase Storage (server-only service role) via lib/storage; uploads normalized with sharp to webp <= 2400px, 12 MB max",
    "cms": "in-app CMS under /admin (pages, sections, posts, artists, media, navigation, media kit, settings, users, audit)",
    "seo": "lib/seo.ts buildMetadata/resolveCanonicalUrl/absolutePageUrl, app/sitemap.ts, app/robots.ts",
    "testing": "node:test unit/auth/database suites, DB integration scripts (tests/integration/*.mjs), Playwright browser specs (tests/browser)",
    "ci": ".github/workflows/cms-ci.yml: legacy-origin check, npm ci, db:migrate, npm test, test:integration, typecheck, build, runtime smoke"
  },
  "commands": {
    "lint": "npm run lint",
    "typecheck": "npm run typecheck",
    "unit": "npm test",
    "integration": "npm run test:integration (requires DATABASE_URL to a local *_test database)",
    "migrate": "npm run db:migrate (local only by design)",
    "build": "npm run build",
    "smoke": "npm run smoke",
    "browser": "npm run test:browser (PLAYWRIGHT_BASE_URL; contact spec needs E2E_CONTACT_SUBMIT=1)",
    "schemaAudit": "node scripts/audit-db.mjs (DATABASE_URL)",
    "schemaCapture": "TEST_DATABASE_URL=...*_test node scripts/capture-db-schema-contract.mjs",
    "migrationPath": "TEST_DATABASE_URL=...*_test node tests/database/migration-path.integration.mjs",
    "legacyOrigin": "node scripts/check-legacy-origin.mjs",
    "claudeOs": "npm run os:validate && npm run test:claude-os"
  },
  "keyPaths": {
    "contactForm": "app/(public)/contato/ContactForm.tsx",
    "contactPage": "app/(public)/contato/page.tsx",
    "contactRoute": "app/api/contact/route.ts",
    "contactLib": "lib/contact.ts",
    "contactIp": "lib/contact-client-ip.ts",
    "contactIdem": "lib/contact-idempotency.ts",
    "outboxPolicy": "lib/contact-outbox-policy.ts",
    "cron": "app/api/cron/integrations/route.ts",
    "sync": "lib/integrations/sync.ts",
    "soundcharts": "lib/integrations/soundcharts.ts",
    "spotify": "lib/integrations/spotify.ts",
    "identity": "lib/integrations/identity.ts",
    "secrets": "lib/integrations/secrets.ts",
    "integrationSchema": "lib/db/integration-schema.ts",
    "schema": "lib/db/schema.ts",
    "artistSchema": "lib/db/artist-management-schema.ts",
    "artistRepo": "modules/artists/repository.ts",
    "artistPage": "app/(public)/artistas/[slug]/page.tsx",
    "home": "app/(public)/page.tsx",
    "settingsIntegrations": "app/admin/(protected)/settings/lander-records/page.tsx",
    "integrationActions": "app/admin/integration-actions.ts",
    "artistActions": "app/admin/artist-actions.ts",
    "spotifyConnect": "app/api/integrations/spotify/connect/route.ts",
    "spotifyCallback": "app/api/integrations/spotify/callback/route.ts",
    "storage": "lib/storage/supabase-storage.ts",
    "mediaEmbed": "lib/media-embed.ts",
    "seo": "lib/seo.ts",
    "sitemap": "app/sitemap.ts",
    "robots": "app/robots.ts",
    "auth": "lib/auth/index.ts",
    "authPolicy": "lib/auth/policy.ts",
    "proxy": "proxy.ts",
    "devBypass": "lib/auth/development-bypass.ts",
    "adminNav": "app/admin/components/admin-navigation.ts",
    "migrate": "scripts/migrate.mjs",
    "schemaContract": "scripts/db-schema-contract.json",
    "envExample": ".env.example",
    "envContract": "docs/ENVIRONMENT_CONTRACT.md",
    "integrationsDoc": "docs/INTEGRATIONS.md",
    "nginx": "infra/nginx/lander-records.conf.example",
    "ci": ".github/workflows/cms-ci.yml",
    "mocks": "lib/mocks/index.ts"
  }
}
