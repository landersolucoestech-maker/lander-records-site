# Workflow identity-reconciliation — Reconcile internal ↔ external identities
# Format: JSON-compatible YAML (YAML 1.2 superset of JSON) — see .claude/decisions/ADR-0002-machine-readable-yaml.md
{
  "id": "identity-reconciliation",
  "title": "Reconcile internal ↔ external identities",
  "trigger": "identity-conflicts signal",
  "phases": [
    {
      "id": "detect",
      "agents": [
        "integrity-lead",
        "data-integrity-auditor"
      ],
      "skills": [
        "cross-provider-reconciliation"
      ],
      "gates": [
        "identity"
      ],
      "transition": "conflicts listed"
    },
    {
      "id": "resolve",
      "agents": [
        "backend-lead"
      ],
      "skills": [
        "identity-resolution",
        "root-cause-analysis"
      ],
      "gates": [
        "identity"
      ],
      "transition": "code fix or data correction plan (guarded)"
    }
  ],
  "stopConditions": [
    "product decision required (DEC)",
    "destructive/data-loss risk",
    "external system or credential unavailable (BLOCKED_EXTERNAL)",
    "unresolvable ambiguity",
    "irreversible architectural change",
    "contradictory requirements"
  ],
  "outputs": [
    "findings/*.json updated",
    "evidence/EV-*.json",
    "atomic commits"
  ],
  "stateTransitions": [
    "READY → INVESTIGATING → ROOT_CAUSE_CONFIRMED → FIXING → VALIDATING → REAUDITING → RESOLVED"
  ],
  "rollback": "identity data corrections go through the guarded data-change path; re-sync regenerates metrics"
}
