name: CMS Foundation CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lander_records_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lander_records_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lander_records_test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CONTACT_IP_HASH_SALT: ci-contact-ip-salt-not-for-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Reject legacy generator branding
        run: node scripts/check-legacy-origin.mjs
      - name: Install dependencies
        run: npm ci
      - name: Agentic Engineering OS self-test
        run: node .codex/runtime/self-test.mjs
      - name: Apply CMS migrations
        run: npm run db:migrate
      - name: Security and hardening tests
        run: npm test
      - name: Integration checks
        run: npm run test:integration
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        env:
          NODE_ENV: production
        run: npm run build
      - name: Public runtime smoke
        env:
          NODE_ENV: production
        run: |
          npm run start -- -p 3000 > /tmp/lander-next.log 2>&1 &
          APP_PID=$!
          cleanup() { kill "$APP_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/home.html; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/lander-next.log
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:3000/artistas/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/noticias/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/politica-de-privacidade/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/termos-e-condicoes/ > /dev/null
          if grep -E "Unhandled|TypeError|ReferenceError|ECONNREFUSED|Internal Server Error" /tmp/lander-next.log; then
            cat /tmp/lander-next.log
            exit 1
          fi
      - name: Publish validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$STATE\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"description\":\"agentic + migrations + security + integration + typecheck + build + smoke\",\"context\":\"cms-foundation-ci\"}"
