name: CMS Foundation CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lander_records_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lander_records_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lander_records_test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CONTACT_IP_HASH_SALT: ci-contact-ip-salt-not-for-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Apply CMS migrations
        run: npm run db:migrate
      - name: Integration checks
        run: npm run test:integration
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        env:
          NODE_ENV: production
        run: npm run build
      - name: Publish validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$STATE\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"description\":\"migrations + integration + typecheck + build\",\"context\":\"cms-foundation-ci\"}"
