name: IONOS readiness validation (deployment blocked)

on:
  workflow_dispatch:
    inputs:
      deploy_commit:
        description: "Exact full commit SHA approved for production"
        required: true
        type: string
      change_ticket:
        description: "Approved production change ticket"
        required: true
        type: string

concurrency:
  group: ionos-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment inputs
        env:
          DEPLOY_COMMIT: ${{ inputs.deploy_commit }}
          CHANGE_TICKET: ${{ inputs.change_ticket }}
        run: |
          case "$DEPLOY_COMMIT" in *[!0-9a-f]*|'') exit 1 ;; esac
          test "$(printf '%s' "$DEPLOY_COMMIT" | wc -c)" -eq 40
          test -n "$CHANGE_TICKET"
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy_commit }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deployment-blocked:
    needs: validate
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Refuse deployment until the real server is inventoried
        run: |
          echo "Deployment remains blocked: implement and review the atomic host-specific release path first." >&2
          exit 1
